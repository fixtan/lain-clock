<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lain Clock</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js"></script>
  </head>

  <body class="clock-window">
    <div id="clock-container">
      <svg id="analog-clock" viewBox="0 0 100 100">
        <g id="clock-numbers"></g>

        <g id="digital-group">
          <text id="digital-time" x="50" y="68" class="digital-time-text">00:00:00</text>
          <text id="tz-label" x="50" y="74" class="digital-tz-text">JST</text>
        </g>

        <g id="hands">
          <polygon id="hour"   points="48,50 50,25 52,50 50,55" class="hand hour-hand" />
          <polygon id="minute" points="49,50 50,15 51,50 50,55" class="hand min-hand"  />
          <line    id="second" x1="50" y1="55" x2="50" y2="10"  class="hand sec-hand"  />
          <circle cx="50" cy="50" r="1.5" fill="#fff" />
        </g>
      </svg>
    </div>
  </body>
</html>
